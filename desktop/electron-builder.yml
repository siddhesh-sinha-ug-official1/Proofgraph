appId: com.proofgraph.desktop
productName: ProofGraph
copyright: "Copyright © 2026 ProofGraph Contributors"

directories:
  buildResources: resources
  output: out

files:
  - dist/**/*

# ── Extra resources bundled alongside the app ──────────────────────────
# Renderer: the pre-built Vite output from app/dist.
# AI server: esbuild-bundled single file (runs on Electron's Node).
# Hub: frozen binary OR Python source (fallback needs system Python).
extraResources:
  - from: ../app/dist
    to: renderer
    filter: ["**/*"]
  - from: resources/ai-server.cjs
    to: ai-server.cjs
  # Hub: try frozen binary first, fall back to bundled Python source.
  # The frozen binary (from freeze-hub.py) goes in resources/hub/ and
  # takes priority. The Python source is always included as fallback.
  - from: resources/hub
    to: hub
    filter: ["**/*"]
  # Hub Python source (fallback when frozen binary is absent)
  - from: ../hub
    to: hub-src
    filter:
      - "**/*.py"
      - "!__pycache__"
  # Python packages the hub imports at runtime
  - from: ../packages/capability-layer
    to: packages/capability-layer
    filter:
      - "**/*.py"
      - "!__pycache__"
      - "!**/node_modules"
  - from: ../packages/structure-extractor
    to: packages/structure-extractor
    filter:
      - "**/*.py"
      - "**/*.scm"
      - "!__pycache__"
      - "!**/node_modules"
      - "!fixtures"
  - from: ../packages/graph-model
    to: packages/graph-model
    filter:
      - "**/*.py"
      - "schema/schema.json"
      - "!__pycache__"
      - "!**/node_modules"
  # Schema package: Python modules + data files (schema.json, PIN, gen/)
  - from: ../packages/schema
    to: packages/schema
    filter:
      - "**/*.py"
      - "schema.json"
      - "capability.json"
      - "vectors.json"
      - "PIN"
      - "gen/schema_constants.py"
      - "gen/capability_constants.py"
      - "gen/graph-schema.ts"
      - "gen/schema.md"
      - "!__pycache__"
      - "!**/node_modules"
      - "!tests"
  - from: ../outerwall
    to: outerwall
    filter:
      - "**/*.py"
      - "!__pycache__"
  # Vessels: multi-cell loader, V1 capability feed, walls, trace data
  - from: ../vessels
    to: vessels
    filter:
      - "**/*.py"
      - "TRACE-node.json"
      - "!__pycache__"
      - "!test_*.py"
      - "!fixtures_v2"
  # Default fixture for first-launch demo (tiny — 3 files)
  - from: ../acceptance/fixtures/moatpkg
    to: acceptance/fixtures/moatpkg
    filter: ["**/*"]

# ── Auto-update from GitHub Releases ───────────────────────────────────
publish:
  provider: github
  owner: siddhesh-sinha-ug-official1
  repo: Proofgraph
  releaseType: release

# ── Windows: NSIS installer ────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  # electron-builder auto-converts 512px PNG → .ico at build time
  icon: resources/icon.png
  # Code signing: set CSC_LINK + CSC_KEY_PASSWORD env vars to sign.
  # When unsigned, run with CSC_IDENTITY_AUTO_DISCOVERY=false to skip.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ProofGraph
  license: ../LICENSE
  deleteAppDataOnUninstall: false
  # Use LZMA instead of 7z to avoid 32-bit NSIS mmap failure
  # on large Electron apps (~280 MB uncompressed).
  differentialPackage: false

# ── macOS: DMG + ZIP (ZIP required for auto-update) ───────────────────
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: resources/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Linux: AppImage + deb ─────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  icon: resources/icons
  category: Development
  maintainer: "ProofGraph <noreply@users.noreply.github.com>"
  synopsis: Proof-graph explorer and verification UI
  description: >
    ProofGraph is a proof-dependency graph explorer with an LSP-backed
    editor, visual graph view, and AI-assisted analysis.

deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3
